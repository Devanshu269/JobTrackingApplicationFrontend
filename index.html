<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080f" />
    <meta name="color-scheme" content="dark" />

    <title>Job Juggler</title>
    <meta
      name="description"
      content="Job Juggler — keep every job application, follow-up and offer in one place."
    />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Job Juggler" />
    <meta property="og:title" content="Job Juggler" />
    <meta
      property="og:description"
      content="Keep every job application, follow-up and offer in one place."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Job Juggler" />
    <meta
      name="twitter:description"
      content="Keep every job application, follow-up and offer in one place."
    />

    <!--
      Loaded without blocking first paint: the sheet is fetched as `print` (which the
      preload scanner still starts early) and promoted to `all` once it arrives. The URL
      already carries `display=swap`, so text was rendering in the fallback face and
      swapping regardless — this only stops the request from holding up the render.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
